# Integration profile: real PostgreSQL via Testcontainers; Flyway creates the schema, Hibernate only validates.
# (datasource settings come from @ServiceConnection)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
filesystem.baseLocation=${java.io.tmpdir}
tng.tls.pem=unused-in-tests
tng.tls.key=unused-in-tests
