# Hermetic test profile: in-memory H2 (PostgreSQL mode), no network, no TLS material
spring.datasource.url=jdbc:h2:mem:gdhcn;MODE=PostgreSQL;NON_KEYWORDS=KEY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
filesystem.baseLocation=${java.io.tmpdir}
tng.tls.pem=unused-in-tests
tng.tls.key=unused-in-tests
spring.flyway.enabled=false
